<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teligen CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--color-neutral-400)}
  a{color:var(--color-accent-700);text-decoration:none}
  a:hover{color:var(--color-accent)}
  .row-hit:hover{background:var(--color-neutral-200);cursor:pointer}
  .nav-on{border-left-color:var(--color-accent) !important;color:var(--color-text);font-weight:600;background:var(--color-neutral-200)}
  .nav-off:hover{background:var(--color-neutral-200)}
  .chip{all:unset;box-sizing:border-box;padding:4px 10px;font-size:12px;cursor:pointer;border:1px solid var(--color-divider)}
  .chip.on{background:var(--color-accent-100);color:var(--color-accent-800);border-color:transparent}
  .avatar{flex:none;background:var(--color-text);color:var(--color-bg);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .avatar-lg{width:34px;height:34px;font-size:12px;background:var(--color-neutral-300);color:var(--color-neutral-900)}
  #auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--color-bg)}
  .auth-card{width:380px;max-width:92vw;padding:var(--space-8) var(--space-6);border:2px solid var(--color-divider)}
  .auth-msg{margin-top:var(--space-3);font-size:13px;padding:var(--space-2) var(--space-3);border:1px solid var(--color-divider)}
  .auth-msg.error{color:var(--color-accent-700);border-color:var(--color-accent-300);background:var(--color-accent-100)}
  .demo-banner{background:var(--color-accent-100);color:var(--color-accent-800);font-size:12px;padding:6px var(--space-4);border-bottom:2px solid var(--color-divider)}
</style>
</head>
<body>

<div id="auth-screen" style="display:none">
  <div class="auth-card">
    <img src="logo.png" alt="Teligen" style="height:32px;width:auto;display:block;margin-bottom:6px">
    <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent);margin-bottom:var(--space-6)">Network API CRM</div>
    <h1 id="auth-title" style="font-size:24px;margin:0 0 4px">Sign in</h1>
    <div id="auth-sub" style="font-size:13px;color:var(--color-neutral-700);margin-bottom:var(--space-4)">Access the Teligen CRM</div>
    <div class="field" style="margin-bottom:var(--space-3)"><label>Email</label><input class="input" type="email" id="auth-email" placeholder="you@011telecom.com"></div>
    <div class="field" style="margin-bottom:var(--space-4)"><label>Password</label><input class="input" type="password" id="auth-pass" placeholder="••••••••"></div>
    <button class="btn btn-primary btn-block" id="auth-btn" onclick="authSubmit()">Sign in</button>
    <button class="btn btn-secondary btn-block" onclick="googleSignIn()">Continue with Google</button>
    <div id="auth-msg" class="auth-msg error" style="display:none"></div>
    <div style="margin-top:var(--space-4);font-size:13px;color:var(--color-neutral-700)">
      <span id="auth-switch-txt">No account?</span>
      <a href="#" id="auth-switch-lnk" onclick="toggleAuth();return false" style="margin-left:4px">Create one</a>
    </div>
  </div>
</div>

<div id="app" style="display:none"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut as fbSignOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ── Firebase config ─────────────────────────────────────────────────────────
// TODO: replace with the Teligen CRM's own Firebase project (see README.md).
// Until this is filled in, the app runs in DEMO_MODE: data is kept in
// localStorage only, no sign-in required. Nothing here talks to
// telecom-deals-f155b — that project is untouched by this app.
const firebaseConfig = {
  apiKey: "AIzaSyDs3nJBeVSLWmIwOJ3ot7FwTNMkSbYlvSQ",
  authDomain: "teligen-crm.firebaseapp.com",
  projectId: "teligen-crm",
  storageBucket: "teligen-crm.firebasestorage.app",
  messagingSenderId: "94705401144",
  appId: "1:94705401144:web:f67b1cc1cc82017781d5cd"
};
const DEMO_MODE = firebaseConfig.apiKey === "REPLACE_ME";
const ALLOWED_DOMAINS = ['@011global.com','@011telecom.com'];

let auth = null, db = null;
if (!DEMO_MODE) {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
}

// ── Tiny data layer — same call shape whether backed by Firestore or, in
// DEMO_MODE, by localStorage. Nothing else in this file cares which. ────────
const LS_KEY = 'teligenCrmDemoData';
let demoStore = {};
let demoWatchers = {};
if (DEMO_MODE) {
  try { demoStore = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { demoStore = {}; }
  for (const c of ['leads','customers','providers','partners','logEntries']) if (!demoStore[c]) demoStore[c] = [];
}
function genId(){ return 'id' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function demoNotify(col){
  localStorage.setItem(LS_KEY, JSON.stringify(demoStore));
  (demoWatchers[col]||[]).forEach(cb=>cb(demoStore[col].map(d=>({...d}))));
}
async function dbAdd(col, data){
  if (DEMO_MODE) { const id=genId(); demoStore[col].push({id,...data}); demoNotify(col); return id; }
  const ref = await addDoc(collection(db,col), data);
  return ref.id;
}
async function dbUpdate(col, id, data){
  if (DEMO_MODE) {
    const i = demoStore[col].findIndex(d=>d.id===id);
    if (i>=0){ demoStore[col][i] = {...demoStore[col][i], ...data}; demoNotify(col); }
    return;
  }
  await updateDoc(doc(db,col,id), data);
}
async function dbDelete(col, id){
  if (DEMO_MODE) { demoStore[col] = demoStore[col].filter(d=>d.id!==id); demoNotify(col); return; }
  await deleteDoc(doc(db,col,id));
}
// Collection name -> error, whenever a live listener fails (almost always a
// Firestore security-rules rejection). Surfaced as a banner in shellHTML()
// instead of silently leaving that data empty, which used to look exactly
// like "my records got deleted" when really they just failed to load.
let dataErrors = {};
function dbWatch(col, cb){
  if (DEMO_MODE) {
    demoWatchers[col] = demoWatchers[col]||[];
    demoWatchers[col].push(cb);
    cb(demoStore[col].map(d=>({...d})));
    return ()=>{ demoWatchers[col] = (demoWatchers[col]||[]).filter(f=>f!==cb); };
  }
  return onSnapshot(collection(db,col), snap=>{
    delete dataErrors[col];
    cb(snap.docs.map(d=>({id:d.id,...d.data()})));
  }, err=>{
    console.error(`Listening to '${col}' failed:`, err);
    dataErrors[col] = err.message || String(err);
    render();
  });
}
// Settings is a single shared doc (tracked APIs, team roster), not a
// collection — same demo/real split as above, plus a setDoc-style upsert
// since there's no per-record id to key off.
function watchSettings(cb){
  if (DEMO_MODE) {
    demoWatchers['settings'] = demoWatchers['settings']||[];
    demoWatchers['settings'].push(cb);
    cb(demoStore.settings ? {...demoStore.settings} : null);
    return ()=>{ demoWatchers['settings'] = (demoWatchers['settings']||[]).filter(f=>f!==cb); };
  }
  return onSnapshot(doc(db,'settings','config'), snap=>{
    delete dataErrors['settings'];
    cb(snap.exists()?snap.data():null);
  }, err=>{
    console.error(`Listening to 'settings' failed:`, err);
    dataErrors['settings'] = err.message || String(err);
    render();
  });
}
async function saveSettings(data){
  if (DEMO_MODE) {
    demoStore.settings = data;
    localStorage.setItem(LS_KEY, JSON.stringify(demoStore));
    (demoWatchers['settings']||[]).forEach(cb=>cb({...data}));
    return;
  }
  await setDoc(doc(db,'settings','config'), data, {merge:true});
}

// ── Constants ────────────────────────────────────────────────────────────
// Tracked APIs and the team roster are editable from the Settings page
// (bottom of the sidebar) and persisted to Firestore — these are just the
// defaults used the first time the app runs, before Settings has saved
// anything. `TEAM_MEMBERS`/`APIS` are reassigned wholesale (not mutated in
// place) whenever settings load or save, everything else just reads them.
let TEAM_MEMBERS = [ {name:'Marcelo Licht', email:'marcelo@011global.com'} ];
let TEAM = []; // derived: TEAM_MEMBERS' names + 'Unassigned' — call refreshTeam() after changing TEAM_MEMBERS
function refreshTeam(){ TEAM = [...TEAM_MEMBERS.map(m=>m.name), 'Unassigned']; }
function nameForEmail(email){
  const m = TEAM_MEMBERS.find(x=>(x.email||'').toLowerCase()===String(email||'').toLowerCase());
  return m ? m.name : null;
}
refreshTeam();
let APIS = ["SIM Swap","Silent Auth","KYC Match","Age Verification"];
const STAGES = ["New","Qualified","Proposal","Pilot","Contracting"];
const CUSTOMER_STATUSES = ["Live","Pilot","Onboarding","Prospect"];
const PROVIDER_KINDS = ["Mobile Operator","Wholesale"];
const PROVIDER_STATUSES = ["Live","Testing","Contracting","Prospect"];
const PARTNER_KICKERS = ["Aggregator","Alliance","Technology","Reseller"];
const CONTACT_KINDS = ["Primary","Technical","Commercial","Billing","Compliance"];
const LOG_KINDS = ["Note","Call","Email","Commercial"];
const TYPE_LABEL = {leads:'Lead', customers:'Customer', providers:'Provider', partners:'Partner'};

let DATA = {leads:[], customers:[], providers:[], partners:[]};
let LOGS = {}; // `${type}:${id}` -> entries (unsorted; render sorts)
let curUser = null;

function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
const S = {
  view: 'today', q: '', filter: 'all', ownerFilter: 'All',
  selected: null, // {type,id}
  logTab: 'All',
  draft: '', draftKind: 'Note', follow: false, followDate: addDays(7),
  replyTo: null, replyText: '', replyKind: 'Note', replyFollow: true, replyDate: addDays(14),
  showEdit: false, editForm: null, editContacts: [], editCov: [], editIntros: [],
  showNew: false, newForm: null
};

// ── Helpers ──────────────────────────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ if(!name) return '—'; const p=String(name).trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'—'; }
function curAuthorName(){
  if(DEMO_MODE) return 'Demo User';
  const u = auth && auth.currentUser;
  if(!u) return 'Unknown';
  return nameForEmail(u.email) || u.displayName || u.email || 'Unknown';
}
function fmtMoney(n){ n=Number(n)||0; return '$'+n.toLocaleString('en-US'); }
function fmtUsers(n){ n=Number(n)||0; if(!n) return '—'; if(n>=1e6) return (n/1e6).toFixed(1)+'M'; if(n>=1e3) return (n/1e3).toFixed(0)+'K'; return String(n); }
function relTime(iso){
  if(!iso) return '';
  const d=new Date(iso), diff=Date.now()-d.getTime();
  const mins=Math.floor(diff/60000);
  if(mins<1) return 'just now';
  if(mins<60) return mins+'m ago';
  const hrs=Math.floor(mins/60);
  if(hrs<24) return hrs+'h ago';
  const days=Math.floor(hrs/24);
  if(days<30) return days+'d ago';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function dueInfo(iso){
  if(!iso) return {label:'', cls:''};
  const due=new Date(iso+'T00:00:00'), today=new Date(); today.setHours(0,0,0,0);
  const diffDays=Math.round((due-today)/86400000);
  if(diffDays<0) return {label:`Overdue by ${-diffDays} day${-diffDays===1?'':'s'}`, cls:'tag tag-accent'};
  if(diffDays===0) return {label:'Due today', cls:'tag tag-accent'};
  if(diffDays===1) return {label:'Due tomorrow', cls:'tag tag-outline'};
  if(diffDays<=7) return {label:`Due in ${diffDays} days`, cls:'tag tag-outline'};
  return {label:'Due '+due.toLocaleDateString('en-US',{month:'short',day:'numeric'}), cls:'tag tag-neutral'};
}
// Per-market, per-API status. Close to a provider's own Integration status
// (Prospect/Testing/Contracting/Live) but scoped to one API in one
// operator's market — a wholesale provider can be Live on an API for one
// operator and not offer it at all for another; the two are independent.
// "Roadmap" here (vs. that field's "Contracting") reads better for "planned
// for this specific API/operator but not yet live."
const MARKET_STATUSES = ['', 'Prospect', 'Testing', 'Roadmap', 'Live'];
// Highest-precedence-first, for collapsing a provider's many markets into
// one headline status per API (Providers table, API-coverage filters).
const MARKET_STATUS_RANK = ['Live', 'Roadmap', 'Testing', 'Prospect', ''];
function apiCell(status){
  if(!status) return {label:'—', cls:''};
  return {label:status, cls:statusTagCls(status)};
}
// A market's apiFlags array is only as long as APIS was when it was saved —
// if an API gets added/removed later in Settings, old rows fall out of sync.
// Also migrates the old 0/1/2 (Not covered/Live/Planned) numeric scheme from
// before per-market statuses existed: 1→Live, 2→Roadmap, 0→not covered.
// Always read flags through this rather than the raw array.
function normFlags(row){
  return APIS.map((_,i)=>{
    const v = row && row.apiFlags && row.apiFlags[i];
    if(typeof v === 'string') return MARKET_STATUSES.includes(v) ? v : '';
    if(v === 1) return 'Live';
    if(v === 2) return 'Roadmap';
    return '';
  });
}
function computeApis(coverage){
  return APIS.map((_,i)=>{
    const statuses=(coverage||[]).map(r=>normFlags(r)[i]);
    for(const s of MARKET_STATUS_RANK){ if(statuses.includes(s)) return s; }
    return '';
  });
}
function statusTagCls(status){
  if(status==='Live') return 'tag tag-accent';
  if(status==='Prospect') return 'tag tag-neutral';
  return 'tag tag-outline';
}
function stageTagCls(stage){
  if(stage==='Contracting'||stage==='Pilot') return 'tag tag-accent';
  if(stage==='New') return 'tag tag-neutral';
  return 'tag tag-outline';
}
function contactKindCls(k){
  if(k==='Primary') return 'tag tag-accent';
  if(k==='Commercial'||k==='Compliance') return 'tag tag-outline';
  return 'tag tag-neutral';
}
function logKindCls(k){
  if(k==='Commercial') return 'tag tag-accent';
  if(k==='Email') return 'tag tag-accent-2';
  if(k==='Call') return 'tag tag-outline';
  return 'tag tag-neutral';
}
function ownerOk(owner){ return S.ownerFilter==='All' || owner===S.ownerFilter; }
function searchOk(rec, extraFields){
  if(!S.q) return true;
  const q=S.q.toLowerCase();
  const hay=[rec.name, ...(extraFields||[]), ...(rec.contacts||[]).flatMap(c=>[c.name,c.role,c.email,c.phone])]
    .filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q);
}
function logKey(type,id){ return type+':'+id; }
function entriesFor(type,id){ return (LOGS[logKey(type,id)]||[]).slice(); }
function allOpenFollowUps(){
  const out=[];
  for(const type of ['leads','customers','providers','partners']){
    for(const rec of DATA[type]){
      if(!ownerOk(rec.owner)) continue;
      for(const e of entriesFor(type,rec.id)){
        if(e.follow && !e.followDone) out.push({...e, type, rec});
      }
    }
  }
  out.sort((a,b)=>(a.followDate||'').localeCompare(b.followDate||''));
  return out;
}
function hasAnyLog(type,id){ return entriesFor(type,id).length>0; }

// ── Nav / view meta ──────────────────────────────────────────────────────
const NAV = [
  {view:'today', label:'Today'},
  {view:'leads', label:'Leads'},
  {view:'customers', label:'Customers'},
  {view:'providers', label:'Providers'},
  {view:'coverage', label:'API coverage'},
  {view:'partners', label:'Partners'}
];
function navCount(view){
  if(view==='today') return allOpenFollowUps().length;
  if(view==='coverage') return DATA.providers.reduce((n,p)=>n+(p.coverage||[]).length,0);
  if(view==='leads') return DATA.leads.length;
  if(view==='customers') return DATA.customers.length;
  if(view==='providers') return DATA.providers.length;
  if(view==='partners') return DATA.partners.length;
  return 0;
}

// ── Root render ──────────────────────────────────────────────────────────
function render(){
  const el = document.getElementById('app');
  try {
    el.innerHTML = shellHTML();
  } catch(e) {
    // A rendering bug used to leave whatever was on screen frozen in place
    // (e.g. a modal that silently "won't close") with zero indication why.
    // Surface it instead — screenshot this and it's a fixable bug report.
    console.error('Render error:', e);
    el.innerHTML = `<div style="padding:40px;font-family:monospace;white-space:pre-wrap;color:#ae1800;background:#fff2ef">Something broke while rendering the page.\nScreenshot this and send it over:\n\n${esc(e && e.stack || e)}</div>`;
  }
}
function shellHTML(){
  const banner = DEMO_MODE ? `<div class="demo-banner">Demo mode — data is stored only in this browser. Configure a real Firebase project in index.html to go live (see README.md).</div>` : '';
  const errCols = Object.keys(dataErrors);
  const errBanner = errCols.length ? `<div class="demo-banner" style="background:var(--color-accent-100);color:var(--color-accent-800)">
    Couldn't load ${errCols.join(', ')} — this is a read failure, not deleted data. Usually means the Firestore security rule from README.md isn't set up (or your sign-in session needs a refresh — try reloading). Detail: ${esc(dataErrors[errCols[0]])}
  </div>` : '';
  return `
  ${banner}${errBanner}
  <div style="display:grid;grid-template-columns:232px 1fr;min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)">
    ${sidebarHTML()}
    <main style="min-width:0;display:flex;flex-direction:column">
      ${S.selected ? recordPageHTML() : (S.view==='settings' ? settingsPageHTML() : listPageHTML())}
    </main>
  </div>
  ${S.showEdit ? editModalHTML() : ''}
  ${S.showNew ? newModalHTML() : ''}
  `;
}
function sidebarHTML(){
  return `
  <aside style="border-right:2px solid var(--color-divider);display:flex;flex-direction:column;padding:var(--space-4) 0">
    <div style="padding:0 var(--space-4) var(--space-4);border-bottom:2px solid var(--color-divider)">
      <img src="logo.png" alt="Teligen" style="height:40px;width:auto;display:block;margin-bottom:6px">
      <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent)">Network API CRM</div>
    </div>
    <nav style="display:flex;flex-direction:column;padding:var(--space-4) 0">
      ${NAV.map(n=>`
        <button onclick="nav('${n.view}')" class="${S.view===n.view && !S.selected ? 'nav-on' : 'nav-off'}" style="all:unset;box-sizing:border-box;display:flex;align-items:baseline;gap:var(--space-2);width:100%;padding:10px var(--space-4);font-size:14px;cursor:pointer;border-left:3px solid transparent">
          <span style="flex:1">${n.label}</span>
          <span style="font-size:11px;color:var(--color-neutral-600)">${navCount(n.view)}</span>
        </button>`).join('')}
    </nav>
    <div style="margin-top:auto;padding:var(--space-4);border-top:2px solid var(--color-divider);font-size:11px;color:var(--color-neutral-700);line-height:1.6">
      ${esc(curAuthorName())}<br>
      <a href="#" onclick="openSettings();return false" style="${S.view==='settings' && !S.selected ? 'color:var(--color-accent);font-weight:600' : ''}">Settings</a>
      &nbsp;·&nbsp;
      <a href="#" onclick="doSignOut();return false">Sign out</a>
    </div>
  </aside>`;
}

// ── List page (header + filter bar + body) ────────────────────────────────
function viewMeta(){
  const m = {
    today: {kicker:'Today', title:'Today', recordWord:null},
    leads: {kicker:'Pipeline', title:'Leads', recordWord:'lead'},
    customers: {kicker:'Demand side', title:'Customers', recordWord:'customer'},
    providers: {kicker:'Supply side', title:'Providers', recordWord:'provider'},
    coverage: {kicker:'By country', title:'API coverage', recordWord:null},
    partners: {kicker:'Channel', title:'Partners', recordWord:'partner'}
  };
  return m[S.view];
}
function filterChips(){
  if(S.view==='leads') return [{v:'all',l:'All'},{v:'Customer',l:'Customer'},{v:'Provider',l:'Provider'},...STAGES.map(s=>({v:s,l:s}))];
  if(S.view==='customers') return [{v:'all',l:'All'}, ...[...new Set(DATA.customers.map(c=>c.industry).filter(Boolean))].map(i=>({v:i,l:i}))];
  if(S.view==='providers' || S.view==='coverage') return [{v:'all',l:'All'},{v:'live',l:'Live only'},{v:'Mobile Operator',l:'Mobile Operator'},{v:'Wholesale',l:'Wholesale'},...APIS.map(a=>({v:'api:'+a,l:a}))];
  if(S.view==='partners') return [{v:'all',l:'All'}, ...PARTNER_KICKERS.map(k=>({v:k,l:k}))];
  return [];
}
function listPageHTML(){
  const meta = viewMeta();
  const chips = filterChips();
  const rows = viewRows();
  return `
    <header style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--space-4);padding:var(--space-6) var(--space-6) var(--space-4);border-bottom:2px solid var(--color-divider)">
      <div style="flex:1 1 240px;min-width:200px">
        <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-700)">${meta.kicker}</div>
        <h1 style="margin:4px 0 0;font-size:30px;line-height:1.05;letter-spacing:-0.02em">${meta.title}</h1>
      </div>
      <div class="field" style="width:170px">
        <label>Account manager</label>
        <select class="input" onchange="setOwnerFilter(this.value)">
          ${['All',...TEAM].map(o=>`<option value="${esc(o)}" ${S.ownerFilter===o?'selected':''}>${esc(o)}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="width:220px">
        <label>&nbsp;</label>
        <input class="input" placeholder="Search" value="${esc(S.q)}" onchange="setSearch(this.value)" onkeydown="if(event.key==='Enter')setSearch(this.value)">
      </div>
      ${S.view==='today' ? `<span style="font-size:12px;color:var(--color-neutral-700);max-width:150px;line-height:1.35">Follow-ups roll up from every relationship log.</span>` : ''}
      ${meta.recordWord ? `<button class="btn btn-primary" onclick="openNew('${S.view}')">New ${meta.recordWord}</button>` : ''}
    </header>
    ${chips.length ? `

function todayHTML(){
  const follows = allOpenFollowUps();
  const overdue = follows.filter(f=>dueInfo(f.followDate).label.startsWith('Overdue')).length;
  const dueWeek = follows.filter(f=>{const l=dueInfo(f.followDate).label; return l==='Due today'||l==='Due tomorrow'||l.startsWith('Due in');}).length;
  const openPipe = DATA.leads.filter(l=>ownerOk(l.owner)).reduce((n,l)=>n+(Number(l.value)||0),0);
  const pendingProviders = DATA.providers.filter(p=>ownerOk(p.owner)&&p.status!=='Live').length;
  const allRecs = [
    ...DATA.leads.map(r=>({...r,type:'leads'})), ...DATA.customers.map(r=>({...r,type:'customers'})),
    ...DATA.providers.map(r=>({...r,type:'providers'})), ...DATA.partners.map(r=>({...r,type:'partners'}))
  ].filter(r=>ownerOk(r.owner));
  const silent = allRecs.filter(r=>!hasAnyLog(r.type,r.id));

  const stats = [
    {k:'Follow-ups open', v:follows.length, sub:overdue+' overdue'},
    {k:'Due this week', v:dueWeek, sub:'includes today/tomorrow'},
    {k:'Open pipeline', v:fmtMoney(openPipe), sub:'sum of lead values in book'},

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border-bottom:2px solid var(--color-divider);margin:0 calc(-1 * var(--space-6))">
      ${stats.map(s=>`

          <div style="font-family:var(--font-heading);font-weight:800;font-size:30px;line-height:1.1;margin-top:6px;letter-spacing:-0.02em">${s.v}</div>
          <div style="font-size:12px;color:var(--color-neutral-700);margin-top:4px">${s.sub}</div>
        </div>`).join('')}
    </div>
    <section style="padding-top:var(--space-6)">
      <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-3)">
        <h2 style="margin:0;font-size:24px;letter-spacing:-0.01em">Pending follow-ups</h2>
        <span style="font-size:12px;color:var(--color-neutral-700)">earliest first</span>

      <div style="display:grid;gap:0;margin-top:var(--space-3)">
        ${follows.map(f=>{
          const due=dueInfo(f.followDate);
          return `
          <div class="row-hit" onclick="openRecord('${f.type}','${f.rec.id}')" style="display:grid;grid-template-columns:168px minmax(0,1fr) auto;gap:var(--space-4);align-items:start;padding:var(--space-4) var(--space-3);border-top:1px solid var(--color-divider)">
            <div style="display:grid;gap:4px">
              <span class="${due.cls}">${due.label}</span>
              <span style="font-size:12px;color:var(--color-neutral-700);font-variant-numeric:tabular-nums">${esc(f.followDate)}</span>
            </div>
            <div style="min-width:0">
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2)">
                <strong style="font-size:15px">${esc(f.rec.name)}</strong>
                <span style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700)">${TYPE_LABEL[f.type]}</span>
                <span class="${logKindCls(f.kind)}">${esc(f.kind)}</span>
                <span style="font-size:12px;color:var(--color-neutral-700)">${esc(f.rec.owner)}</span>
              </div>
              <p style="margin:5px 0 0;font-size:14px;line-height:1.5">${esc(f.text)}</p>
              <div style="font-size:11px;color:var(--color-neutral-600);margin-top:4px">Logged by ${esc(f.author)} · ${relTime(f.createdAt)}</div>
            </div>
            <div style="display:grid;gap:4px;justify-items:stretch" onclick="event.stopPropagation()">
              <button class="btn btn-secondary" onclick="markDone('${f.type}','${f.rec.id}','${f.id}')">Mark done</button>
              <button class="btn btn-ghost" onclick="openRecord('${f.type}','${f.rec.id}','${f.id}')">Log outcome</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </section>
    <section style="padding-top:var(--space-8)">
      <h2 style="margin:0;font-size:24px;letter-spacing:-0.01em">Accounts with no activity logged</h2>
      ${!silent.length ? `<div style="padding:var(--space-4) 0;font-size:14px;color:var(--color-neutral-700)">Every account in this book has at least one log entry.</div>` : ''}
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0;margin-top:var(--space-3)">
        ${silent.map(r=>`
          <div class="row-hit" onclick="openRecord('${r.type}','${r.id}')" style="padding:var(--space-3);border-top:1px solid var(--color-divider)">

            <div style="font-size:12px;color:var(--color-neutral-700)">${TYPE_LABEL[r.type]} · ${esc(r.country||'')}</div>
            <div style="font-size:12px;color:var(--color-neutral-700)">${esc(r.owner)}</div>
          </div>`).join('')}
      </div>
    </section>
  `;
}

function providerPassesFilter(p){
  if(S.filter==='all') return true;
  if(S.filter==='live') return p.status==='Live';
  if(S.filter==='Mobile Operator'||S.filter==='Wholesale') return p.kind===S.filter;
  if(S.filter.startsWith('api:')){
    const idx=APIS.indexOf(S.filter.slice(4));
    return !!computeApis(p.coverage)[idx];
  }
  return true;
}

function tableRows_coverage(){
  let rows = [];
  for(const p of DATA.providers){
    if(!ownerOk(p.owner)) continue;
    for(const r of (p.coverage||[])){
      rows.push({country:r.country, operator:r.operator, apiFlags:normFlags(r), provider:p});
    }
  }
  rows.sort((a,b)=> (a.country||'').localeCompare(b.country||'') || (a.operator||'').localeCompare(b.operator||''));
  rows = rows.filter(r=>{
    if(S.filter==='all') return true;
    if(S.filter==='live') return r.apiFlags.some(f=>f==='Live');
    if(S.filter==='Mobile Operator'||S.filter==='Wholesale') return r.provider.kind===S.filter;
    if(S.filter.startsWith('api:')){ const idx=APIS.indexOf(S.filter.slice(4)); return !!r.apiFlags[idx]; }
    return true;
  }).filter(r=>!S.q || (r.country+' '+r.operator+' '+r.provider.name).toLowerCase().includes(S.q.toLowerCase()));
  let lastCountry=null;
  const html = `
    <table class="table"><thead><tr>
      <th>Country</th><th>Operator</th><th>Source</th>${APIS.map(a=>`<th>${a}</th>`).join('')}
    </tr></thead><tbody>
      ${rows.map(r=>{
        const showCountry = r.country!==lastCountry; lastCountry=r.country;
        return `
        <tr class="row-hit" onclick="openRecord('providers','${r.provider.id}')">
          <td style="font-weight:${showCountry?600:400}">${showCountry?esc(r.country):''}</td>
          <td style="font-weight:600">${esc(r.operator)}</td>
          <td style="color:var(--color-neutral-700)">${esc(r.provider.name)} <span class="tag ${r.provider.kind==='Wholesale'?'tag-neutral':'tag-outline'}">${r.provider.kind==='Wholesale'?'Wholesale':'MNO'}</span></td>
          ${r.apiFlags.map(f=>{const c=apiCell(f);return `<td><span class="${c.cls}">${c.label}</span></td>`}).join('')}
        </tr>`;}).join('')}
    </tbody></table>
    ${!rows.length?`<div style="padding:var(--space-8) 0;font-size:14px;color:var(--color-neutral-700)">No records match this filter.</div>`:''}
  `;
  return {html, count: rows.length};
}

function recordStats(type, rec){
  if(type==='leads') return [

  if(type==='providers'){

// ── Relationship log ───────────────────────────────────────────────────
function logSectionHTML(type, rec){
  const allowMap = {All:null, Notes:['Note'], Calls:['Call'], Email:['Email'], Commercial:['Commercial']};
  const allow = allowMap[S.logTab];
  let entries = entriesFor(type, rec.id);
  const roots = entries.filter(e=>!e.parentId && (!allow||allow.includes(e.kind)))
    .sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  function withDescendants(e, depth){
    const kids = entries.filter(c=>c.parentId===e.id).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
    let out = [{...e, depth}];
    kids.forEach(k=>{ out = out.concat(withDescendants(k, depth+1)); });
    return out;
  }
  const flat = roots.flatMap(e=>withDescendants(e,0));

  return `
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-4)">
    <h2 style="margin:0;font-size:22px;letter-spacing:-0.01em">Relationship log</h2>
    <div class="seg" style="margin-left:auto">
      ${['All','Notes','Calls','Email','Commercial'].map(t=>`
        <label class="seg-opt"><input type="radio" name="logtab" ${S.logTab===t?'checked':''} onchange="setLogTab('${t}')"><span>${t}</span></label>`).join('')}
    </div>
  </div>
  <div id="composer-box" style="display:flex;gap:var(--space-3);margin-top:var(--space-4);padding:var(--space-4);border:1px solid var(--color-divider)">
    <div class="avatar avatar-lg" style="background:var(--color-text);color:var(--color-bg)">${esc(initials(curAuthorName()))}</div>
    <div style="flex:1;min-width:0;display:grid;gap:var(--space-3)">
      <textarea class="input" id="composer-text" style="min-height:76px" placeholder="Log a note, call, email or commercial update…" onchange="setDraft(this.value)">${esc(S.draft)}</textarea>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2)">
        <select class="input" style="width:auto" onchange="setDraftKind(this.value)">
          ${LOG_KINDS.map(k=>`<option ${S.draftKind===k?'selected':''}>${k}</option>`).join('')}
        </select>
        <button class="chip ${S.follow?'on':''}" onclick="toggleFollow()">Needs follow-up</button>
        ${S.follow?`<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-neutral-700)">by
          <input class="input" type="date" style="width:auto;padding:5px 8px;font-size:13px" value="${esc(S.followDate)}" onchange="setFollowDate(this.value)">
        </label>`:''}
        <span style="margin-left:auto;font-size:11px;color:var(--color-neutral-700);max-width:120px;line-height:1.3">Visible to the whole team</span>
        <button class="btn btn-primary" onclick="postLog('${type}','${rec.id}')">Post</button>
      </div>
    </div>
  </div>
  ${!flat.length?`<div style="padding:var(--space-4) 0;font-size:13px;color:var(--color-neutral-700)">No entries in this filter — add the first one above.</div>`:''}
  <div style="margin-top:var(--space-4)">
    ${flat.map(e=>{
      const due = e.follow && !e.followDone ? dueInfo(e.followDate) : null;
      const canAct = e.follow && !e.followDone && !S.replyTo;
      const replyOpen = S.replyTo===e.id;
      return `
      <article style="display:grid;grid-template-columns:34px minmax(0,1fr);gap:var(--space-3);padding:var(--space-4) 0 var(--space-4) ${e.depth*26}px;border-top:1px solid var(--color-divider)">
        <div class="avatar avatar-lg">${esc(e.initials||initials(e.author))}</div>
        <div style="min-width:0">
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);font-size:13px">
            <strong>${esc(e.author)}</strong>
            <span class="${logKindCls(e.kind)}">${esc(e.kind)}</span>
            <span style="color:var(--color-neutral-700)">${relTime(e.createdAt)}</span>
            ${due?`<span class="${due.cls}">Follow up ${esc(e.followDate)}</span><span style="font-size:12px;color:var(--color-neutral-700)">${due.label}</span>`:''}
            ${e.followDone && e.closedOn?`<span class="tag tag-neutral">Closed ${esc(e.closedOn)}</span>`:''}
          </div>
          <p style="margin:6px 0 0;font-size:14px;line-height:1.5">${esc(e.text)}</p>
          ${canAct?`
            <div style="display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-2)">
              <button class="btn btn-secondary" onclick="markDone('${type}','${rec.id}','${e.id}')">Mark done</button>
              <button class="btn btn-ghost" onclick="startReply('${e.id}')">Log outcome &amp; reschedule</button>
            </div>`:''}
          ${replyOpen?`
            <div style="margin-top:var(--space-3);padding:var(--space-3);border:1px solid var(--color-divider);display:grid;gap:var(--space-2)">
              <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-700)">What happened — this closes the follow-up above</div>
              <textarea class="input" style="min-height:64px" placeholder="Called and spoke to them — need to call back…" onchange="setReplyText(this.value)">${esc(S.replyText)}</textarea>
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2)">
                <select class="input" style="width:auto" onchange="setReplyKind(this.value)">
                  ${LOG_KINDS.map(k=>`<option ${S.replyKind===k?'selected':''}>${k}</option>`).join('')}
                </select>
                <button class="chip ${S.replyFollow?'on':''}" onclick="toggleReplyFollow()">Next follow-up</button>
                ${S.replyFollow?`<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-neutral-700)">on
                  <input class="input" type="date" style="width:auto;padding:5px 8px;font-size:13px" value="${esc(S.replyDate)}" onchange="setReplyDate(this.value)">
                </label>`:''}
                <button class="btn btn-primary" style="margin-left:auto" onclick="postReply('${type}','${rec.id}','${e.id}')">Post</button>
                <button class="btn btn-ghost" onclick="cancelReply()">Cancel</button>
              </div>
            </div>`:''}
        </div>
      </article>`;
    }).join('')}
  </div>`;
}

              </select>` : `<input class="input" value="${esc(S.newForm[f.k]||'')}" onchange="newFieldChange('${f.k}',this.value)">`}
          </div>`).join('')}
      </div>
    </section>
  </div>`;
}

// ── Settings ─────────────────────────────────────────────────────────────
// Tracked APIs and the team roster used to be hardcoded constants requiring
// a code change + redeploy. They're editable here instead, stored in one
// shared Firestore doc (`settings/config`) — every signed-in user sees the
// same list, and it updates live for everyone once saved.
function settingsPageHTML(){
  // Reachable by restoring '#/settings' from the URL on load/hashchange,
  // which (unlike openSettings()) doesn't build this form first -- self-heal
  // rather than crash if it's missing.
  if(!S.settingsForm) S.settingsForm = { apis:[...APIS], team: TEAM_MEMBERS.map(m=>({...m})) };
  const f = S.settingsForm;
  return `
    <header style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--space-4);padding:var(--space-6) var(--space-6) var(--space-4);border-bottom:2px solid var(--color-divider)">
      <div style="flex:1 1 240px;min-width:200px">
        <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-700)">Configuration</div>
        <h1 style="margin:4px 0 0;font-size:30px;line-height:1.05;letter-spacing:-0.02em">Settings</h1>
      </div>
      <button class="btn btn-secondary" onclick="closeSettings()">Back</button>
      <button class="btn btn-primary" onclick="saveSettingsForm()">Save changes</button>
    </header>
    <div style="flex:1;overflow:auto;padding:var(--space-6)">
      <section style="max-width:640px;margin-bottom:var(--space-8)">
        <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)">
          <h2 style="margin:0;font-size:22px;letter-spacing:-0.01em">Tracked APIs</h2>
          <button class="btn btn-secondary" style="margin-left:auto" onclick="settingsAddApi()">+ Add API</button>
        </div>
        <p style="font-size:13px;color:var(--color-neutral-700);margin:0 0 var(--space-3)">Shown as columns on Providers, API coverage, and as the Interest options on Leads. Existing coverage on providers is unaffected by reordering or adding — a market simply reads as "not covered" for any API it hasn't been set for.</p>
        ${f.apis.map((a,i)=>`
          <div style="display:flex;gap:var(--space-2);align-items:center;padding:var(--space-2) 0;border-top:1px solid var(--color-divider)">
            <input class="input" value="${esc(a)}" onchange="settingsApiChange(${i},this.value)">
            <button class="btn btn-ghost" onclick="settingsRemoveApi(${i})">Remove</button>
          </div>`).join('')}
      </section>
      <section style="max-width:640px">
        <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)">
          <h2 style="margin:0;font-size:22px;letter-spacing:-0.01em">Account managers</h2>
          <button class="btn btn-secondary" style="margin-left:auto" onclick="settingsAddMember()">+ Add person</button>
        </div>
        <p style="font-size:13px;color:var(--color-neutral-700);margin:0 0 var(--space-3)">Whoever signs in with one of these emails is attributed by name on everything they log or create. Add new teammates here before they sign in — otherwise their raw email shows up until you do. "Unassigned" is always available as a fallback and doesn't need to be listed.</p>
        ${f.team.map((m,i)=>`
          <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:var(--space-2);align-items:center;padding:var(--space-2) 0;border-top:1px solid var(--color-divider)">
            <input class="input" placeholder="Name" value="${esc(m.name)}" onchange="settingsMemberChange(${i},'name',this.value)">
            <input class="input" placeholder="email@011global.com" value="${esc(m.email)}" onchange="settingsMemberChange(${i},'email',this.value)">
            <button class="btn btn-ghost" onclick="settingsRemoveMember(${i})">Remove</button>
          </div>`).join('')}
      </section>
    </div>
  `;
}

window.saveEdit = async function(){
  const {type,id} = S.selected;
  try {
    const data = {...S.editForm};
    delete data.id;
    data.contacts = S.editContacts.filter(c=>c.name && c.name.trim());
    if(type==='providers'){ data.coverage = S.editCov.filter(r=>r.country&&r.country.trim()); data.apis = computeApis(data.coverage); }
    if(type==='partners'){ data.intros = S.editIntros.filter(r=>r.name&&r.name.trim()); }
    if(type==='leads' || type==='customers'){ data.value = Number(data.value)||0; data.arr = Number(data.arr)||0; }
    if(type==='providers'){ data.users = Number(data.users)||0; }
    await dbUpdate(type, id, data);
    S.showEdit = false; render();
  } catch(e) {
    console.error('saveEdit failed:', e);
    alert('Could not save — nothing was lost, your edits are still in this form. Error: ' + (e && e.message || e));
  }
};

    else if(type==='partners') data = {...base, name:S.newForm.name||'Untitled partner', kicker:S.newForm.kicker||PARTNER_KICKERS[0], body:S.newForm.body||'', status:'Prospect', share:'', joint:0, since:'', intros:[]};

window.deleteRecord = async function(){
  const {type,id} = S.selected;
  const rec = recordOf(type,id);
  if(!rec) return;
  if(!confirm(`Delete "${rec.name}"? This removes the record and its relationship log. This cannot be undone.`)) return;
  try {
    await dbDelete(type, id);
    // Its logEntries are orphaned on purpose rather than bulk-deleted here —
    // Firestore has no client-side "delete where" and this is a rare action;
    // orphaned entries never surface anywhere since every view looks them up
    // by an existing record's id.
    S.selected = null;
    window.nav(type);
  } catch(e) {
    console.error('deleteRecord failed:', e);
    alert('Could not delete. Error: ' + (e && e.message || e));
  }
};
window.reassignAM = async function(newOwner){
  const {type,id} = S.selected;
  const rec = recordOf(type,id);
  const oldOwner = rec.owner;
  if(newOwner===oldOwner) return;
  try {
    await dbUpdate(type, id, {owner:newOwner});
    await dbAdd('logEntries', {recordType:type, recordId:id, parentId:null, kind:'Note', author:curAuthorName(), text:`Account manager changed from ${oldOwner} to ${newOwner}.`, follow:false, followDate:null, followDone:false, closedOn:null, createdAt:new Date().toISOString()});
    render();
  } catch(e) {
    console.error('reassignAM failed:', e);
    alert('Could not reassign — Error: ' + (e && e.message || e));
    render();
  }
};

window.authSubmit = async function(){
  const email = document.getElementById('auth-email').value.trim();

  if(!email||!pass){ showAuthMsg('Please enter email and password.'); return; }
  if(authMode==='signup' && !ALLOWED_DOMAINS.some(d=>email.toLowerCase().endsWith(d))){
    showAuthMsg('Access is restricted to @011global.com and @011telecom.com email addresses.'); return;
  }
  const btn=document.getElementById('auth-btn'); btn.disabled=true;
  try{
    if(authMode==='signup') await createUserWithEmailAndPassword(auth,email,pass);
    else await signInWithEmailAndPassword(auth,email,pass);

  try {
    const apis = S.settingsForm.apis.map(a=>a.trim()).filter(Boolean);
    const team = S.settingsForm.team.map(m=>({name:(m.name||'').trim(), email:(m.email||'').trim()})).filter(m=>m.name && m.email);
    if(!apis.length){ alert('Keep at least one tracked API.'); return; }

// ── Boot ─────────────────────────────────────────────────────────────
function wireListeners(){
  dbWatch('leads', rows=>{ DATA.leads=rows; render(); });
  dbWatch('customers', rows=>{ DATA.customers=rows; render(); });
  dbWatch('providers', rows=>{ DATA.providers=rows; render(); });
  dbWatch('partners', rows=>{ DATA.partners=rows; render(); });
  dbWatch('logEntries', rows=>{
    LOGS = {};
    rows.forEach(e=>{ const key=logKey(e.recordType,e.recordId); (LOGS[key]=LOGS[key]||[]).push(e); });
    render();
  });
  watchSettings(data=>{
    if(data){
      if(Array.isArray(data.apis) && data.apis.length) APIS = data.apis;
      if(Array.isArray(data.team)) TEAM_MEMBERS = data.team;
      refreshTeam();
    } else {
      // Nothing saved yet — seed the shared doc with today's defaults so
      // every signed-in user starts from the same list, then stop: the
      // watcher above will fire again with that data once it round-trips.
      saveSettings({apis:APIS, team:TEAM_MEMBERS}).catch(e=>console.error('Could not seed default settings:', e));
    }
    render();
  });
}
function bootApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='block';
  const h = location.hash.replace(/^#\//,'').split('/');
  if(h[0]==='settings') S.view='settings';
  else if(h[0] && NAV.some(n=>n.view===h[0])) S.view=h[0];
  if(['leads','customers','providers','partners'].includes(h[0]) && h[1]) S.selected={type:h[0], id:h[1]};
  wireListeners();
  render();
}
window.addEventListener('hashchange', ()=>{
  if(!document.getElementById('app').style.display || document.getElementById('app').style.display==='none') return;
  const h = location.hash.replace(/^#\//,'').split('/');
  if(['leads','customers','providers','partners'].includes(h[0]) && h[1]){ S.selected={type:h[0],id:h[1]}; }
  else if(h[0]==='settings'){ S.view='settings'; S.selected=null; }
  else if(h[0] && NAV.some(n=>n.view===h[0])){ S.view=h[0]; S.selected=null; }
  render();
});

if(DEMO_MODE){
  curUser = {displayName:'Demo User', email:'demo@011telecom.com'};
  bootApp();
} else {
  document.getElementById('auth-screen').style.display='flex';
  onAuthStateChanged(auth, user=>{
    if(user){ curUser=user; bootApp(); }
    else {
      document.getElementById('auth-screen').style.display='flex';
      document.getElementById('app').style.display='none';
    }
  });
}
